<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OptiSlot — Allocate. Prove. Revise.</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","camera-controls":"https://cdn.jsdelivr.net/npm/camera-controls@2.8.5/dist/camera-controls.module.js"}}</script>
<style>
:root{color-scheme:dark;--bg:#0A0D13;--p1:#10141D;--p2:#151A25;--p3:#1B2130;--ln:#232A3A;--tx:#E6EAF2;--mu:#8791A7;--v:#7C5CFF;--c:#22D3EE;--ok:#34D399;--wa:#FBBF24;--er:#F87171;
--AI:#4F8CFF;--AO:#A78BFA;--DI:#34D399;--DO:#FBBF24;--DOI:#F87171;--AL:#F472B6;
--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans);height:100vh;display:grid;grid-template-columns:216px 1fr;grid-template-rows:56px 1fr;overflow:hidden}
.mono{font-family:var(--mono)}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#rail{grid-row:1/3;background:var(--p1);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;margin:0 6px 4px;font-weight:700;font-size:16px;letter-spacing:-.2px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;box-shadow:0 0 18px #7c5cff66}
.tag{font-size:10px;color:var(--mu);margin:0 6px 14px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--mu);cursor:pointer;position:relative;transition:.2s;border:1px solid transparent}
.nav b{font:600 10px var(--mono);width:18px;color:#5b6479}.nav:hover{color:var(--tx);background:var(--p2);box-shadow:0 0 14px #7c5cff22}
.nav.on{color:#fff;background:linear-gradient(90deg,#7c5cff33,#7c5cff0d);border-color:#7c5cff55}.nav.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--v);box-shadow:0 0 10px var(--v)}
.rfoot{margin-top:auto;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--p2);font-size:11px;color:var(--mu)}
#top{display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--ln);background:var(--p1)}
.proj{font-weight:600}.proj small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--mu);padding:5px 12px;border-radius:7px;cursor:pointer;font:600 12px var(--sans);transition:.2s}.seg button.on{background:var(--v);color:#fff;box-shadow:0 0 12px #7c5cff77}
.score{margin-left:auto;display:flex;gap:10px}.sc{padding:5px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--p2);min-width:104px}
.sc small{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.sc b{font:600 17px var(--mono)}
main{overflow:auto;padding:22px 26px;position:relative}.page{display:none}.page.on{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:20px;letter-spacing:-.3px;margin-bottom:2px}.sub{color:var(--mu);margin-bottom:18px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px;transition:.25s}.card:hover{border-color:#7c5cff55;box-shadow:0 0 24px #7c5cff18}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.mt{margin-top:16px}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--ln);background:var(--p3);color:var(--tx);padding:8px 14px;border-radius:9px;cursor:pointer;font:600 12px var(--sans);transition:.2s}.btn:hover{border-color:var(--v);box-shadow:0 0 16px #7c5cff55;transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--v),#5b8cff);border:0;color:#fff;box-shadow:0 4px 20px #7c5cff55}.btn.dng:hover{border-color:var(--er);box-shadow:0 0 16px #f8717155}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 11px var(--sans);border:1px solid;white-space:nowrap}
.ok{color:var(--ok);background:#34d3991a;border-color:#34d39944}.wa{color:var(--wa);background:#fbbf241a;border-color:#fbbf2444}.er{color:var(--er);background:#f871711a;border-color:#f8717144}.nu{color:var(--mu);background:#8791a71a;border-color:#8791a744}.vi{color:#b3a1ff;background:#7c5cff1f;border-color:#7c5cff55}
.t{width:100%;border-collapse:collapse}.t th{position:sticky;top:0;background:var(--p2);text-align:left;font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--ln)}
.t td{padding:6px 10px;border-bottom:1px solid #1a2030;font-size:12px;white-space:nowrap}.t tr{transition:.15s}.t tbody tr:hover{background:#7c5cff14}.t tr.sel{background:#7c5cff26}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.drop{border:2px dashed #7c5cff77;border-radius:16px;padding:34px;text-align:center;background:radial-gradient(ellipse at top,#7c5cff1f,transparent 70%);transition:.3s;cursor:pointer}.drop:hover{border-color:var(--c);box-shadow:0 0 34px #22d3ee33;transform:scale(1.005)}
.drop svg{width:38px;height:38px;color:var(--v)}.drop h2{margin:8px 0 2px}
.scroll{max-height:380px;overflow:auto;border:1px solid var(--ln);border-radius:10px}
.bar{height:7px;border-radius:9px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:10px}.sp{margin-left:auto}input,select{background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:7px 10px;font:12px var(--sans);outline:0;transition:.2s}input:focus,select:focus{border-color:var(--v);box-shadow:0 0 0 3px #7c5cff33}
.sw{width:34px;height:19px;border-radius:99px;background:#2a3246;position:relative;cursor:pointer;transition:.25s;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:var(--v);box-shadow:0 0 12px #7c5cff88}.sw.on:after{left:17px}
.rule{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--ln);border-radius:11px;background:var(--p2);margin-bottom:8px;transition:.2s}.rule:hover{border-color:#7c5cff66}.rule small{color:var(--mu);display:block}
.rule input{width:70px;font-family:var(--mono);text-align:right}
.room{height:340px;border-radius:14px;border:1px solid var(--ln);background:radial-gradient(ellipse at 50% 110%,#7c5cff33,transparent 60%),linear-gradient(#0d111a,#07090e);position:relative;overflow:hidden;transition:.3s}
.room:before{content:"";position:absolute;inset:auto -20% -30% -20%;height:70%;background:repeating-linear-gradient(90deg,#22d3ee14 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,#22d3ee14 0 1px,transparent 1px 36px);transform:perspective(500px) rotateX(62deg)}
.cab{cursor:pointer;transition:.25s}.cab:hover{filter:drop-shadow(0 0 12px #22d3ee)}
.info{position:absolute;right:16px;top:16px;width:230px;background:#10141df0;border:1px solid #7c5cff77;border-radius:12px;padding:12px;backdrop-filter:blur(8px);box-shadow:0 0 30px #7c5cff44}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:12px;color:var(--mu);font-size:12px}.crumb span{padding:3px 9px;border-radius:7px;background:var(--p2);border:1px solid var(--ln);cursor:pointer}.crumb span:last-child{color:#fff;border-color:var(--v)}
.verdict{padding:12px;border-radius:10px;margin-top:10px;animation:in .3s}.verdict.ok{border:1px solid #34d39966}.verdict.er{border:1px solid #f8717166}.verdict b{display:block;font-size:13px;margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;background:var(--p2);border:1px solid var(--ln);font-size:12px;transition:.3s}.chk .tk{width:20px;height:20px;border-radius:50%;background:#34d3991f;color:var(--ok);display:grid;place-items:center;transition:.3s}.chk .tk svg{width:12px;height:12px;stroke-width:3}
.chk.bad{border-color:#f8717188;background:#f871711a}.chk.bad .tk{background:#f871711f;color:var(--er)}.chk.scan{border-color:var(--c);box-shadow:0 0 14px #22d3ee55}.chk.pend .tk{background:#8791a722;color:var(--mu)}
.sweep{position:absolute;left:0;right:0;height:70px;background:linear-gradient(transparent,#22d3ee33,transparent);border-bottom:2px solid var(--c);pointer-events:none;opacity:0}.sweep.go{animation:sw 2.2s ease-in-out}@keyframes sw{0%{top:0;opacity:1}95%{opacity:1}100%{top:100%;opacity:0}}
.cert{font:11px var(--mono);word-break:break-all;color:var(--c);background:var(--bg);border:1px solid var(--ln);padding:10px;border-radius:9px}
.file{display:flex;gap:14px;align-items:center}.file .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:#7c5cff22;color:#b3a1ff}
.big{font:700 30px var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3246;border-radius:9px}
.leg{display:flex;gap:14px;font-size:11px;color:var(--mu);flex-wrap:wrap}

.r3grid{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.r3host{position:relative;height:max(480px,calc(100vh - 190px));border-radius:14px;border:1px solid var(--ln);overflow:hidden;background:#0A0D13}
.r3host canvas{position:absolute;inset:0;display:block;touch-action:none}
.r3host:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.r3load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu)}
.r3hud{position:absolute;z-index:2}.r3hud>*{pointer-events:auto}
.r3tl{left:14px;top:12px;pointer-events:none}.r3tl>*{pointer-events:auto}
.r3title{font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:5px}.r3title b{color:var(--v)}
#r3crumbs span{color:var(--mu);cursor:pointer}#r3crumbs span:hover{color:var(--tx)}#r3crumbs span.cur{color:var(--tx);cursor:default}#r3crumbs i{color:#3a4256;font-style:normal;margin:0 6px}
.r3tr{right:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.r3tr .btn{padding:7px 11px;background:#141822b3;backdrop-filter:blur(8px)}.r3tr .btn.pri{background:linear-gradient(135deg,var(--v),#5b8cff)}
#r3q{width:150px;background:#141822b3;backdrop-filter:blur(8px)}#r3q.bad{border-color:var(--er);animation:sh .3s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.r3lg{left:14px;bottom:12px;display:flex;gap:12px;color:var(--mu);font-size:11px}.r3lg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.r3hint{right:14px;bottom:12px;color:var(--mu);font-size:11px;pointer-events:none}
.r3info{right:12px;top:58px;width:230px;padding:13px;border-radius:12px;background:#0e121bd1;border:1px solid #7c5cff77;backdrop-filter:blur(12px);box-shadow:0 0 30px #7c5cff33;opacity:0;transform:translateX(14px);transition:.4s;pointer-events:none}
.r3info.on{opacity:1;transform:none;pointer-events:auto}.r3info h2{font-size:14px;margin-bottom:1px}.r3info .tg{color:var(--mu);font:11px var(--mono);margin-bottom:10px}
.r3info dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-bottom:12px}.r3info dt{color:var(--mu)}.r3info dd{text-align:right;font-family:var(--mono);font-size:12px}
.r3about{left:14px;top:62px;width:250px;padding:12px 14px;border-radius:12px;background:#0e121bd1;border:1px solid var(--ln);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:.4s}.r3about.on{opacity:1;pointer-events:auto}.r3about p{color:var(--mu);margin-top:5px;font-size:12px}
.r3host .lb,#r3tip{position:absolute;left:0;top:0;z-index:1;pointer-events:none;font-size:10px;letter-spacing:.14em;white-space:nowrap;padding:2px 9px;border:1px solid #3a3470;border-radius:99px;background:#0e121ba6;opacity:0;transition:opacity .3s}
#r3tip{z-index:3;letter-spacing:.04em;transition:opacity .15s}
@media(max-width:1000px){.r3grid{grid-template-columns:1fr}}
</style></head><body>
<aside id="rail"></aside>
<header id="top">
 <div class="proj">Unit 400 · Polymerisation<small>Project PX-2291 · DeltaV v14.3 · CHARM I/O</small></div>
 <div class="seg" id="rev"><button class="on" data-r="A">Rev A</button><button data-r="B">Rev B</button></div>
 <div class="score" id="score"></div>
</header>
<main id="main"></main>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const I={imp:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/>',alloc:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/>',room:'<path d="m12 3 9 5v8l-9 5-9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8"/>',wb:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',rules:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',proof:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',rev:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',exp:'<path d="M12 15V3m0 0L8 7m4-4 4 4M4 17v3h16v-3"/>',chk:'<path d="m5 12 5 5 9-10"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',play:'<path d="m6 4 14 8-14 8z"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const COL={AI:'--AI',AO:'--AO',DI:'--DI',DO:'--DO','DO-ISO':'--DOI',ALM:'--AL'};
const tp=t=>`<span class="chip" style="color:var(${COL[t]});border-color:var(${COL[t]})55;background:var(${COL[t]})18">${t}</span>`;
const st=s=>({allocated:'ok',warning:'wa',unallocated:'nu',quarantined:'er'}[s]);
const stc=s=>`<span class="chip ${st(s)}">● ${s}</span>`;
const pages=[['import','Import','imp'],['allocate','Allocate','alloc'],['room','3D Room','room'],['bench','Workbench','wb'],['rules','Rules','rules'],['proof','Proof','proof'],['revs','Revisions','rev'],['export','Export','exp']];
$('#rail').innerHTML=`<div class="logo"><i>${ic('alloc').replace('<svg','<svg style="color:#fff"')}</i>OptiSlot</div><div class="tag">Allocate. Prove. Revise.</div>`+pages.map((p,i)=>`<div class="nav" data-p="${p[0]}"><b>0${i+1}</b>${ic(p[2])}${p[1]}</div>`).join('')+`<div class="rfoot"><div class="row"><span class="dot" style="background:var(--ok);box-shadow:0 0 8px var(--ok)"></span>Solver online</div><div class="mono" style="margin-top:4px">v2.4.1 · seed 7C5C</div></div>`;
const tps=['AI','AI','DI','DO','AO','DI','DO-ISO','ALM','AI','DI'],cabs=['CAB-01','CAB-02','CAB-03 (Iso)','CAB-04'],stt=['allocated','allocated','allocated','allocated','allocated','warning','allocated','unallocated','allocated','quarantined'];
const pre=['FT','TT','PT','LT','XV','HS','ZSC','FV','PDT','AT'];
const S=Array.from({length:25},(_,i)=>{const t=tps[i%10],s=stt[(i*7)%10];const un=s=='unallocated'||s=='quarantined';return{tag:`${pre[i%10]}-${1001+i*3}`,t,cable:`C${12+(i>>2)}/P${(i%8)+1}`,cab:un?'—':(t=='DO-ISO'?cabs[2]:cabs[i%2==0?0:(i%3==0?3:1)]),cioc:un?'—':`CIOC-${(i%2)+1}`,bp:un?'—':`BP-${(i>>3)+1}`,ch:un?'—':`C${(i%12)+1}`,s,why:{allocated:'Segregation & spare policy satisfied',warning:'Cabinet at 91% — spare margin below 20%',unallocated:'No compatible CHARM free in zone',quarantined:'Missing range data (4–20 mA span)'}[s]}});
const P={};
P.import=`<h1>Import</h1><div class="sub">Drop an IO list. OptiSlot maps, validates and pre-flights it before a single signal is placed.</div>
<div class="drop">${ic('imp')}<h2>Drop IO list here</h2><div class="sub" style="margin:0">.xlsx · .csv · .xls — or <u>browse</u> · Loaded: <span class="mono">U400_IOList_RevC.xlsx</span> (412 KB)</div></div>
<div class="g2 mt"><div class="card"><h3>Column mapping</h3><table class="t"><thead><tr><th>Source column</th><th>→ Field</th><th>Sample</th><th>Confidence</th></tr></thead><tbody id="map"></tbody></table></div>
<div class="card"><h3>Pre-flight summary</h3><div id="pre"></div><button class="btn pri mt" style="width:100%;justify-content:center" onclick="go('allocate');runAlloc()">${ic('play')}Allocate</button></div></div>
<div class="card mt"><h3>Preview · first 10 rows of 1,284</h3><div class="scroll" style="max-height:300px"><table class="t"><thead><tr><th>#</th><th>Tag</th><th>Description</th><th>Type</th><th>Range</th><th>Cable</th><th>Zone</th></tr></thead><tbody id="prev"></tbody></table></div></div>`;
P.allocate=`<h1>Allocate</h1><div class="sub">Deterministic solver · seed 7C5C · segregation, spares and loading rules applied.</div>
<div class="card"><div class="row"><div><div class="big" id="pct">0%</div><div class="sub" style="margin:0" id="phase">Idle</div></div><button class="btn pri sp" onclick="runAlloc()">${ic('play')}Run allocation</button></div><div class="bar mt"><i id="pbar"></i></div></div>
<div class="g4 mt" id="cabs"></div>`;
P.room=`<div class="row" style="margin-bottom:12px"><div><h1>3D Room</h1><div class="sub" style="margin:0">Click to dive Room → Cabinet → CIOC → Baseplate → CHARM. Drag to orbit, scroll to dolly.</div></div><div class="seg sp" id="ba"><button>Before</button><button class="on">Now</button></div></div>
<div class="r3grid"><div class="r3host" id="r3"><div class="r3load mono">Loading 3D engine…</div>
<div class="r3hud r3tl"><div class="r3title">MARSHALLING <b>ROOM</b></div><div id="r3crumbs"></div></div>
<div class="r3hud r3tr"><input id="r3q" placeholder="Go to tag e.g. 2-3-5-7" autocomplete="off" spellcheck="false"><button class="btn" id="r3a" title="How it works">ⓘ</button><button class="btn" id="r3zi">+</button><button class="btn" id="r3zo">−</button><button class="btn" id="r3back">← Esc</button><button class="btn pri" id="r3dive">▶ Upload Dive</button></div>
<div class="r3hud r3lg" id="r3lg"></div><div class="r3hud r3hint">Click to zoom in · drag to orbit · scroll to dolly</div>
<div class="r3hud r3info on" id="r3info"></div>
<div class="r3hud r3about on" id="r3about"><b style="color:var(--v);letter-spacing:.1em">HOW IT WORKS</b><p>3 cabinets → 4 CIOCs → 8 baseplates → 12 CHARMs = 1,152 modules, one instanced mesh. Hover previews, click zooms, Esc goes back. Try the <b>Before / Now</b> toggle to see what Rev B changed.</p></div>
<div id="r3labels"></div><div id="r3tip"></div></div>
<div class="card"><h3>Changes · Rev A → Now</h3><div id="chg"></div></div></div>`;
