[project]
name = "optislot"
version = "0.1.0"
description = "OptiSlot - IO Signal Sudoku: allocate, prove, revise"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "ortools>=9.10",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "lxml>=6.1.3",
    "anthropic>=2.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.8",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-W ignore::DeprecationWarning"
